services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: soportix
      POSTGRES_USER: soportix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soportix"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: pgsql:host=db;dbname=soportix
      DB_USER: soportix
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      METRICS_TOKEN: ${METRICS_TOKEN:?Define METRICS_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$METRICS_TOKEN\" > /tmp/token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [prometheus]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Define GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  db:
  caddy:
  prometheus:
  grafana:
