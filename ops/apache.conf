ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/soportix/public
    <Directory /var/www/soportix/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
